# HTTP 自动跳转 HTTPS
server {
    listen 80;
    server_name kxbz365.cn www.kxbz365.cn;
    return 301 https://$server_name$request_uri;
}

# HTTPS 服务
server {
    listen 443 ssl;
    server_name kxbz365.cn www.kxbz365.cn;

    ssl_certificate /etc/letsencrypt/live/kxbz365.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kxbz365.cn/privkey.pem;

    # 前端静态文件
    location / {
        root /var/www/twym/app/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API 代理到后端
    location /api/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Admin 代理到后端
    location /admin {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /admin/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
